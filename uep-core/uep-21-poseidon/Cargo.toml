[package]
name = "uep21-poseidon-r1cs"
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
description = "UEP-21 BN254 Poseidon native hash and R1CS gadget integration"

[dependencies]
ark-bn254 = "0.3"
ark-ff = "0.3"
ark-r1cs-std = "0.3"
ark-relations = "0.3"
arkworks-native-gadgets = "1.2.0"
arkworks-r1cs-gadgets = "1.2.0"
arkworks-utils = { version = "1.0.1", features = ["poseidon_bn254_x5_3"] }

# Pins required for Rust 1.75 / Cargo 1.75 (environment constraint)
zeroize = "=1.6.0"
zeroize_derive = "=1.4.2"
pest = "=2.7.14"
proc-macro2 = "=1.0.86"
quote = "=1.0.37"
syn = { version = "=2.0.87", features = ["full"] }
rayon = "=1.10.0"
rayon-core = "=1.12.1"
crossbeam-utils = "=0.8.19"
crossbeam-epoch = "=0.9.18"
crossbeam-deque = "=0.8.5"

[dev-dependencies]
ark-groth16 = "0.3"
ark-std = "0.3"
ark-snark = "0.3"

[features]
default = ["bn254"]
bn254 = []
