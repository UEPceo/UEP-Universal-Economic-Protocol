name: Bug report
description: Report a reproducible bug in the public testnet, Marketplace or IoT/M2M layer.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Security vulnerabilities must not be reported here.** Follow [SECURITY.md](https://github.com/UEPceo/UEP-Universal-Economic-Protocol/blob/main/SECURITY.md) and report them privately to uep.dev@proton.me. Never include private keys, tokens, mnemonics or personal data.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ledger / testnet (src/testnet, src/core)
        - Marketplace (src/marketplace)
        - IoT/M2M (src/service)
        - Identity / addresses (src/identity, src/core/address.ts)
        - Docs / examples
        - CI / tooling
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag or commit SHA (`git rev-parse --short HEAD`).
      placeholder: v0.4.6-public-iot-m2m or 5eb1afb
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node.js version (`node --version`) and operating system.
      placeholder: Node 24.x on Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of commands or code that shows the problem. A failing test case is ideal.
      placeholder: |
        1. npm ci
        2. npm run ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the error code or message if there is one.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste test output or logs. This is rendered as code, so no backticks are needed.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This is not a security vulnerability (those go privately through SECURITY.md).
          required: true
        - label: I removed any private keys, mnemonics, tokens and personal data from this report.
          required: true
        - label: I searched existing issues for duplicates.
          required: false
