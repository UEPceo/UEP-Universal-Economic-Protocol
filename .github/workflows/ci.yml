name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking: testnet core, Marketplace, settlement, oracle, categories, IoT/M2M,
  # smoke, quickstart, 20k simulation and Rust crates (npm run test:core).
  # The badge reflects this job and the blocking `labs` job below.
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set up Rust 1.85.1 (uep-core lab crates)
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          cargo --version

      - name: Cache cargo registry and uep-core/target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            uep-core/target
          key: cargo-${{ runner.os }}-1.85.1-${{ hashFiles('uep-core/**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      # ADR 0002: no external calls or wall-clock reads in transition code.
      # Also the first step of test:all; kept separate so a failure is named.
      - name: Deterministic transitions lint
        run: npm run lint:determinism

      # docs/COMPATIBILITY.md: a snapshot format change needs a migration step and golden fixtures.
      - name: Snapshot compatibility check
        run: npm run check:snapshot-compat

      # Offline bech32 check of the public BTC donation address (donations only).
      - name: Donation address check
        run: npm run check:donation
      - name: Version is numeric semver
        run: npm run check:version
      # 0.5.82: source adapters stay off-node; src/ may not import scripts/adapters.
      - name: No src import of scripts/adapters
        run: npm run check:adapters

      # 0.5.81 item 10: critical security tests (H1 commit atomicity, vote binding, snapshot
      # rules, registry binding, transport envelope, marketplace state machine, numeric rules).
      # Also part of test:core; run first so a failure is named. Blocking.
      - name: Critical security tests (npm run test:security)
        run: npm run test:security

      - name: Core suites (npm run test:core)
        run: npm run test:core

      - name: Index benches
        run: node --experimental-strip-types scripts/bench-indexes.ts

  # Blocking (0.5.81 item 10): seeded property / fuzz / multi-process fault runs over a fixed
  # seed list. Seeds, environment, commit and per-run results are uploaded as an artifact.
  property:
    name: Seeded property and fault runs (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seeded runs (npm run test:property:full)
        run: npm run test:property:full

      - name: Upload run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seeded-runs
          path: artifacts/test-runs/
          if-no-files-found: warn

  # Blocking (v0.5.3): every lab file EXCEPT those listed in
  # scripts/lab-known-issues.json, including the 12 labs fixed in v0.5.3
  # (TCP mesh tie-break, full-mesh wait, uep35.7.1 economic commitment).
  # A failure here fails CI.
  labs:
    name: Labs (blocking, known issues excluded)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Rust 1.85.1 (uep-core lab crates)
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          cargo --version

      - name: Cache cargo registry and uep-core/target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            uep-core/target
          key: cargo-${{ runner.os }}-1.85.1-${{ hashFiles('uep-core/**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Build uep-zk
        run: npm run build:uep-zk

      - name: Lab suites (npm run test:lab)
        run: npm run test:lab

  # Non-blocking: lab files listed in scripts/lab-known-issues.json (known lab
  # issues and timing-sensitive multi-process tests). Failures here do not fail CI.
  # v0.5.3: the list is empty; the job runs no files and stays for future entries.
  lab-known-issues:
    name: Labs with known issues (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Set up Rust 1.85.1 (uep-core lab crates)
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          cargo --version

      - name: Cache cargo registry and uep-core/target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            uep-core/target
          key: cargo-${{ runner.os }}-1.85.1-${{ hashFiles('uep-core/**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Build uep-zk
        run: npm run build:uep-zk

      - name: Known-issue lab files (npm run test:lab:known)
        run: npm run test:lab:known

  # Non-blocking: TypeScript type check (tsc --noEmit with tsconfig.json). The
  # suites run TypeScript through Node's type stripping, which does not check
  # types; this job reports the remaining type errors without failing CI.
  # The tools are installed for this job only (not package dependencies).
  typecheck:
    name: Type check (tsc --noEmit, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies and the type checker
        run: |
          npm ci
          npm install --no-save --no-package-lock typescript@5.9.3 @types/node@22

      - name: tsc --noEmit
        run: npx tsc --noEmit -p .
