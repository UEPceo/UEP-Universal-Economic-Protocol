name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Set up Rust 1.85.1 (uep-core lab crates)
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup default 1.85.1
          cargo --version

      - name: Cache cargo registry and uep-core/target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            uep-core/target
          key: cargo-${{ runner.os }}-1.85.1-${{ hashFiles('uep-core/**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      - name: Full suite (npm run test:all)
        run: npm run test:all
